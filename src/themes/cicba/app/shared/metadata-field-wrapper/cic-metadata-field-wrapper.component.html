<div class="simple-view-element" [ngClass]="{'not-inline-label': !inlineLabel }" [class.d-none]="hideIfNoTextContent && content.textContent.trim().length === 0">
  @if (label) {
    <h6 class="simple-view-element-header">{{ label }}</h6>
  }
  <div #content>
    <ng-content></ng-content>
  </div>
</div>
